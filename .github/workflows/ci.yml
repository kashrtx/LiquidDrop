name: CI
# Runs on every push to any branch: builds, uploads test builds, runs tests.
# Download the built app from the run's "Artifacts" section.
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bundle pdf.js (offline PDF preview)
        shell: bash
        run: ./scripts/fetch-vendor.sh
      - name: Build
        run: cargo build --release
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: liquiddrop-${{ runner.os }}
          path: |
            target/release/liquiddrop.exe
            target/release/liquiddrop
          if-no-files-found: ignore
          retention-days: 14
      - name: Tests
        run: cargo test --release
      - name: Minimal build (no optional features)
        run: cargo build --release --no-default-features --target-dir target/minimal
